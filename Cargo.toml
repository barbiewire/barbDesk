[package]
name = "barbdesk"
version = "0.1.0"
edition = "2021"
description = "Swaps the audio of barbiewire's open-source Roblox projects for copies uploaded to your own account."
license = "MIT"

[[bin]]
name = "barbDesk"
path = "src/main.rs"

[dependencies]
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rpassword = "7"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
